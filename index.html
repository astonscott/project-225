<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project 225</title>
<meta name="description" content="Long drive Phase 1 — 12-week mass and speed program, daily sessions, set logging, speed logs.">
<meta name="theme-color" content="#F1F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1411" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --surface-2:#E8ECE5; --ink:#161C18; --ink-2:#4E5A52; --muted:#7A867E;
  --line:#D5DBD3; --line-strong:#B9C2B8;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --good:#1E7B4F; --good-soft:#DFF0E6; --warn:#A8690F; --warn-soft:#F8ECD4; --crit:#B23A2E; --crit-soft:#F7E0DC;
  --series:#1F4FD8; --series-wash:rgba(31,79,216,.10); --target:#7A867E;
  --shadow:0 1px 2px rgba(22,28,24,.06), 0 6px 18px rgba(22,28,24,.06);
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --nav-h:58px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1411; --surface:#171D19; --surface-2:#1F2722; --ink:#ECF0EA; --ink-2:#B7C0B9; --muted:#8B968E;
    --line:#2A332D; --line-strong:#3B463F;
    --accent:#7B97FF; --accent-ink:#0F1411; --accent-soft:#1F2A4A;
    --good:#5CC48C; --good-soft:#173627; --warn:#E0A64A; --warn-soft:#3A2B10; --crit:#F08A7E; --crit-soft:#3E1B17;
    --series:#7B97FF; --series-wash:rgba(123,151,255,.14); --target:#8B968E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);min-height:100%;overscroll-behavior-y:none}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* Top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;padding-bottom:10px}
.top h1{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.01em;line-height:1;text-transform:uppercase;white-space:nowrap}
.top .ctx{font-size:12.5px;color:var(--ink-2);text-align:right;line-height:1.3}
.top .ctx b{color:var(--ink);font-weight:700;display:block}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:0 4px}
.nav button{background:transparent;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:8px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--accent)}
.view{display:none}
.view.on{display:block}
main .wrap{padding-top:16px;padding-bottom:24px}
section+section{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.sec-h .meta{font-size:13px;color:var(--muted)}
h3{font-size:16.5px;font-weight:700;margin-bottom:6px}
.lede{color:var(--ink-2);max-width:62ch}
.prose{max-width:66ch}
.prose p+p{margin-top:10px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.gym{background:var(--accent-soft);color:var(--accent)}
.pill.speed{background:var(--good-soft);color:var(--good)}
.pill.rest{background:var(--surface-2);color:var(--muted)}
.pill.test{background:var(--warn-soft);color:var(--warn)}
.note{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--ink-2)}
.note strong{color:var(--ink)}
.callout{border-left:3px solid var(--accent);padding:10px 14px;background:var(--surface);border-radius:0 var(--r) var(--r) 0;font-size:15px}
.callout.warn{border-left-color:var(--warn)}
.callout.crit{border-left-color:var(--crit)}
.callout.good{border-left-color:var(--good)}
.callout p+p{margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:12px 18px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink-2);font-weight:600}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.btn.good{background:var(--good);color:#fff}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Today */
.today-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.today-h .d{font-family:var(--display);font-size:36px;font-weight:800;line-height:.95;text-transform:uppercase;white-space:nowrap}
.today-h .d small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0;margin-bottom:4px}
.today-h .wk{text-align:right;font-size:12.5px;color:var(--ink-2);flex:1;max-width:62%}
.today-h .wk b{display:block;font-size:15px;color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);margin-bottom:14px}
.strip>div{padding:9px 12px;border-left:1px solid var(--line);min-width:0}
.strip>div:first-child{border-left:0}
.strip .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.strip .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip .v small{font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted);margin-left:2px}
.strip .n{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sessions{display:flex;flex-direction:column;gap:10px}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sess.done{border-color:var(--good)}
.sess .top-r{display:flex;align-items:flex-start;gap:12px;padding:12px 12px 12px 14px}
.sess .t{flex:1;min-width:0}
.sess .name{font-weight:700;font-size:16px;line-height:1.25}
.sess .desc{font-size:13px;color:var(--ink-2);margin-top:3px}
.sess .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.sess .time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sess .act{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.chk{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:2px solid var(--line-strong);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;margin-top:2px}
.chk svg{width:16px;height:16px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk[aria-checked="true"]{background:var(--good);border-color:var(--good)}
.chk[aria-checked="true"] svg{opacity:1}
.sess details>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);list-style:none;padding:8px 14px;border-top:1px solid var(--line);user-select:none}
.sess details>summary::-webkit-details-marker{display:none}
.sess details>summary::after{content:"Show";float:right;color:var(--muted);font-weight:400}
.sess details[open]>summary::after{content:"Hide"}
.sess .more{padding:8px 14px 12px}
.rest .sess{background:transparent;border-style:dashed}
.quick{display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;align-items:center;margin-top:14px}
.quick label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.quick input{font-family:var(--mono);font-size:16px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.tomorrow{margin-top:18px}
.tomorrow .eyebrow{margin-bottom:6px}
.tomorrow ul{list-style:none;margin:0;padding:0;font-size:14px;color:var(--ink-2)}
.tomorrow li{padding:4px 0;display:flex;gap:10px}
.tomorrow li .tm{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;padding-top:2px}

/* Week */
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weeknav button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:18px;line-height:1}
.weeknav .wk{flex:1;display:flex;flex-direction:column;min-width:0}
.weeknav .wk b{font-family:var(--display);font-size:21px;font-weight:800;text-transform:uppercase;line-height:1.1}
.weeknav .wk span{font-size:12.5px;color:var(--muted)}
.weeknav .today{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:0 12px;height:38px;font-size:13px;font-weight:600;cursor:pointer}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease}
.day{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.day:last-child{border-bottom:1px solid var(--line)}
.day.today .dlabel b{color:var(--accent)}
.dlabel{display:flex;flex-direction:column}
.dlabel b{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;line-height:1}
.dlabel span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Tables */
.xt{width:100%;border-collapse:collapse;font-size:14px}
.xt th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.xt td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.xt tr:last-child td{border-bottom:0}
.xt td.code{font-family:var(--mono);font-size:12px;color:var(--muted);width:30px;white-space:nowrap}
.xt td.rx{font-family:var(--mono);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.xt td.rx.now{color:var(--ink);font-weight:600}
.xt td.rx.dim{color:var(--muted)}
.xt .sub{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.steps{margin:0;padding-left:20px;font-size:14.5px}
.steps li{margin:5px 0}
.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.blocks{grid-template-columns:1fr}}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.block.now{border-color:var(--accent);box-shadow:var(--shadow)}
.block .bn{font-family:var(--display);font-size:21px;font-weight:800;text-transform:uppercase;line-height:1}
.block .bw{font-size:12px;color:var(--muted);margin-top:2px}
.block .bg{font-weight:700;font-size:14px;margin-top:8px}
.block ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.milestones{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.milestones th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.milestones td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
.milestones td.num{font-family:var(--mono);font-size:13px}
.milestones tr.hit td{color:var(--good)}
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.daycard h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daycard .when{font-size:13px;color:var(--muted);margin-bottom:8px}
.daycards{display:flex;flex-direction:column;gap:12px}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Log */
.logform{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;align-items:end}
.logform label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.logform input,.logform select{font-size:15px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.logform input[type=number]{font-family:var(--mono);font-size:14px}
.logform .full{grid-column:1/-1}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 6px;position:relative;margin-top:12px}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);display:none;font-variant-numeric:tabular-nums}
.chart .cl{display:flex;gap:16px;font-size:12px;color:var(--muted);padding:6px 8px 2px;flex-wrap:wrap}
.chart .cl i{display:inline-block;width:14px;height:0;border-top:2px solid var(--series);vertical-align:middle;margin-right:6px}
.chart .cl i.t{border-top:2px dashed var(--target)}
.chart .cl i.s{border-top:1px solid var(--line-strong)}
.loglist{list-style:none;margin:10px 0 0;padding:0;font-size:14px}
.loglist li{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.loglist li:first-child{border-top:0}
.loglist li.empty{display:block;color:var(--muted);padding:10px 0}
.loglist .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.loglist .val{font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:0}
.loglist .val b{font-weight:600;color:var(--ink)}
.loglist .val span{color:var(--muted);font-size:12px;margin-left:8px}
.loglist .val .nt{display:block;font-family:var(--body);font-size:13px;color:var(--ink-2);margin-top:2px;margin-left:0}
.loglist .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 6px;border-radius:6px}
.loglist .x:hover{background:var(--crit-soft);color:var(--crit)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px;white-space:nowrap}
.stat .v small{font-size:11px;color:var(--muted);font-weight:600;margin-left:2px}
.stat .v.up{color:var(--good)}
.stat .v.dn{color:var(--crit)}
.maxes{width:100%;border-collapse:collapse;font-size:14px}
.maxes th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.maxes td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.maxes td.n{font-family:var(--mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.maxes td.n b{font-weight:600}
.maxes .up{color:var(--good)}

/* Settings / more */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.set .item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.set .item:first-child{border-top:0}
.set .item .l{font-size:14.5px}
.set .item .l small{display:block;color:var(--muted);font-size:12px}
.set input[type=time],.set input[type=number],.set select{font-family:var(--mono);font-size:14px;padding:7px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);width:112px}
.set input[type=number]{width:84px}
.tests{width:100%;border-collapse:collapse;font-size:13.5px}
.tests th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.tests td{padding:6px 6px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tin{width:60px;font-family:var(--mono);font-size:13px;padding:5px 6px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink)}
.gear{width:100%;border-collapse:collapse;font-size:14px}
.gear th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.gear td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.gear td.p{font-family:var(--mono);font-size:13px;white-space:nowrap}

/* Session overlay (in-session mode) */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
.ov.on{display:flex}
.ov .ovh{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
.ov .ovh .t{flex:1;min-width:0}
.ov .ovh .t b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .ovh .t span{font-size:12px;color:var(--muted)}
.ov .ovh button.ic{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;display:grid;place-items:center}
.ov .ovb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(120px + env(safe-area-inset-bottom))}
.ov .ovb .wrap{padding:0;max-width:720px;margin:0 auto}
.exnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.exnav::-webkit-scrollbar{display:none}
.exnav button{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;font-family:var(--mono);color:var(--ink-2);cursor:pointer}
.exnav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exnav button.done{border-color:var(--good);color:var(--good)}
.exhead{margin-bottom:10px}
.exhead .code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.exhead h2{font-family:var(--display);font-size:28px;font-weight:800;text-transform:uppercase;line-height:1}
.exhead .rx{font-family:var(--mono);font-size:14px;margin-top:4px;color:var(--ink)}
.exhead .cue{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.beat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px}
.beat>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;min-width:0}
.beat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.beat .v{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.beat .v small{font-size:11px;color:var(--muted);font-weight:400}
.beat>div.hi{border-color:var(--accent)}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.setrow.done{border-color:var(--good);background:var(--good-soft)}
.setrow .i{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.setrow label{display:flex;flex-direction:column;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;min-width:0}
.setrow input{font-family:var(--mono);font-size:17px;padding:7px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0;font-variant-numeric:tabular-nums}
.setrow .lg{width:44px;height:44px;border-radius:10px;border:2px solid var(--line-strong);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.setrow .lg svg{width:20px;height:20px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.setrow.done .lg{background:var(--good);border-color:var(--good)}
.setrow.done .lg svg{opacity:1}
.exfoot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.maxin{display:flex;gap:8px;align-items:end;margin:8px 0 12px;background:var(--surface-2);border-radius:var(--r);padding:10px 12px}
.maxin label{flex:1;display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.maxin input{font-family:var(--mono);font-size:15px;padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
/* rest timer bar */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:14px;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
.timer.on{display:flex}
.timer .tt{font-family:var(--display);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;min-width:96px}
.timer .tl{flex:1;font-size:13px;opacity:.8}
.timer .tl b{display:block;font-size:14px;opacity:1}
.timer button{border:1px solid rgba(255,255,255,.3);background:transparent;color:inherit;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13px}
.timer.over{background:var(--good);color:#fff}
/* speed session */
.clock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center;margin-bottom:12px}
.clock .big{font-family:var(--display);font-size:72px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock .big.warn{color:var(--warn)}
.clock .big.over{color:var(--crit)}
.clock .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.clock .row{justify-content:center;margin-top:10px}
.balls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.ball{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.ball .k{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ball input{width:100%;font-family:var(--mono);font-size:18px;padding:6px 6px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.ball .g{margin-top:6px;display:flex;gap:4px}
.ball .g button{flex:1;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;font-size:11px;font-weight:700;padding:4px 0;cursor:pointer;color:var(--muted)}
.ball .g button[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.setsum{list-style:none;margin:0 0 12px;padding:0;font-size:14px}
.setsum li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:center}
.setsum li:first-child{border-top:0}
.setsum .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.setsum .v{font-family:var(--mono);font-size:13px}
.setsum .v b{font-weight:600}
.chkl{list-style:none;margin:0 0 14px;padding:0}
.chkl li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.chkl li:first-child{border-top:0}
.chkl li.done{color:var(--muted);text-decoration:line-through}
.chkl .chk{margin-top:0;width:26px;height:26px;border-radius:7px}
.ovfoot{position:fixed;left:0;right:0;bottom:0;z-index:42;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.ovfoot .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;white-space:nowrap}
.toast.on{opacity:1}
.upd{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:55;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;display:none;align-items:center;gap:12px;font-size:14px;box-shadow:var(--shadow)}
.upd.on{display:flex}
.upd button{margin-left:auto;border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
.review{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.review h3{display:flex;justify-content:space-between;align-items:baseline}
.review h3 span{font-size:12px;color:var(--muted);font-weight:600}
.review .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px;margin:8px 0}
.review .kv div b{font-family:var(--mono);font-weight:600}
.review .kv div small{display:block;color:var(--muted);font-size:11.5px}
.review p{font-size:13.5px;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ---------- Program data ---------- */
const PLAN = {
  start: new Date(2026, 8, 14),          // Monday, Week 1

const BLOCKS = [
  { n: 1, name: 'Accumulate', weeks: '1–4', goal: 'Add tissue and work capacity. Groove the overspeed protocol. Moderate loads, more sets.',
    bullets: ['Main lifts 4×6 @ 72–77% (RPE 7–8)', 'Accessories 3×8–12, double progression', 'Overspeed: 2 rounds, 3×/week', 'Driver-speed swings ≈ 50/week', 'Week 4 = deload + retest'] },

];

const RX_LEGEND = 'Prescriptions read sets × reps. Percentages are of your current 1RM. Add 2.5–5 lb (upper) or 5–10 lb (lower) each week inside a block; if the last set passes RPE 9, hold the weight. Accessories: hit the top of the rep range on every set, then add weight.';

// Gym sessions. rx: [block1, block2, block3]
const GYM = {
  gym1: { id: 'gym1', kind: 'gym', name: 'Gym 1 · Lower strength + vertical power', short: 'Lower strength + power', dur: '70 min',
    desc: 'Squat pattern, hinge, single-leg, lateral push-off. Vertical force is the biggest single lever on club speed.',

    ex: [
      ['A1','Box jump or countermovement jump', '4×3', '4×3', 'Trap bar jump 5×3 @ 20–30% BW', 'Full rest. Max height, quiet landing.'],

      ['E2','Suitcase carry', '3×30 m / side', '3×30 m / side', '3×30 m / side', 'Grip + lateral trunk. Heavy.'],
    ] },
  gym2: { id: 'gym2', kind: 'gym', name: 'Gym 2 · Upper strength + rotational power', short: 'Upper strength + rotation', dur: '65 min',
    desc: 'Throws first while you\'re fresh, then press and pull heavy, then the rotational cable work that builds the release.',
    warm: 'Band pull-aparts, thoracic open-books, wall slides, 10 light med-ball rotations each side, 5 push-ups.',
    deload: 'Deload: throws 2 sets. Bench 3×5 @ 65–70%. Pull-ups 3×5 bodyweight. Accessories 2 sets.',
    ex: [
      ['A1','Med ball rotational scoop throw (wall)', '4×4 / side · 8–10 lb', '5×3 / side · 10–12 lb', '6×3 / side · 6–8 lb, max speed', 'Golf posture, full turn, hips lead. Both sides every set.'],
      ['A2','Med ball chest pass / shot put', '4×4 · 8–10 lb', '5×3 · 10–12 lb', 'Plyo push-up 5×3', 'Arm speed. Explosive, not grinding.'],

      ['B','Push press (or strict overhead press)', '4×8', '5×5', '4×3', 'Push press in Blocks 2–3: legs drive, arms finish.'],

      ['D1','Incline dumbbell press', '3×10', '3×10', '3×8', ''],
      ['D2','Seated cable row', '3×10–12', '3×10', '3×8', ''],
      ['E1','Lateral raise', '3×15', '3×15', '2×15', ''],
      ['E2','Rear delt fly', '3×15', '3×15', '2×15', ''],

// Speed sessions. steps: per block (index 0,1,2); deload variant.
const SPEED = {
  speedA: { id: 'speedA', kind: 'speed', name: 'Speed A · Overspeed, no ball', short: 'Overspeed (no ball)', dur: '25–30 min',
    desc: 'Do this before Gym 1, while the nervous system is fresh. Every swing is max intent.',
    steps: [
      ['Warm-up 8 min: 90/90s, open-books, leg swings, then 10 progressive swings from 60% to 90%.',
       'Overspeed round = light 5/5/5, medium 5/5/5, heavy 5/5/5 (dominant side / non-dominant side / step-through). Rest 60–90 s between sets.',
       'Block 1: <b>2 rounds</b> (90 swings). Note the peak speed at each weight.',
       'Finisher: 10 max-effort driver swings on the radar. Record the peak club speed.',
       'With the Stack: follow the app\'s prescribed session instead of the fixed rounds — it periodizes the weights for you.'],
      ['Warm-up 8 min as in Block 1.',
       'Overspeed: <b>3 rounds</b> of light/medium/heavy 5/5/5 (135 swings). Rest 60–90 s.',

       'Finisher: 10 max-effort driver swings on the radar. Record peak club speed.'],
      ['Warm-up 8 min.',
       'Overspeed: <b>3 rounds</b> weeks 9–11; <b>1 round</b> week 12 (taper).',
       'Light and medium only in the third round — chase the number, not fatigue.',
       'Finisher: 8 max-effort driver swings. Stop early if speed drops 3% below your best of the day.'],
    ],
    deload: 'Deload: 1 round, no step-through swings, 6 max-effort driver swings.' },
  speedB: { id: 'speedB', kind: 'speed', name: 'Speed B · Overspeed + hitting', short: 'Overspeed + transfer', dur: '40 min',
    desc: 'Range or net with the radar. Half technique, half intent. This is where club speed becomes ball speed.',
    steps: [
      ['Warm-up 10 min: mobility, 10 wedge swings, 10 7-iron swings, 6 driver at 80%.',
       'Overspeed: <b>1 round</b>, light and medium only.',
       '12 drivers at 85–90%: foot spray or impact tape on the face, find centre contact. Smash factor is your feedback (target 1.48–1.50).',

      ['Warm-up 10 min as in Block 1.',
       'Overspeed: <b>2 rounds</b>, light and medium only.',
       '10 drivers at 85–90% on the tape. Then 3 × 6-ball sets at max intent, 3 min rest.',
       'Tee height and ball position audit every session: you want +5° to +8° attack angle — if the radar\'s distance number lags ball speed, you\'re hitting down.'],
      ['Warm-up 10 min.',
       'Overspeed: <b>1 round</b>, light only.',
       '8 drivers at 90%, then 4 × 6-ball sets on a 2:45 clock (competition rhythm).',
       'Week 12: 2 sets only.'],

/* ---------- Helpers ---------- */

/* ---------- Charts ---------- */
function lineChart(el, cfg) {
  if (!el) return;
  const narrow = window.innerWidth < 560;
  const W = narrow ? Math.max(320, Math.min(520, window.innerWidth - 40)) : 700, H = narrow ? 230 : 260, L = 46, R = 18, T = 18, B = 30;
  const x0 = cfg.xDomain[0].getTime(), x1 = cfg.xDomain[1].getTime();
  const pts = cfg.points.slice().sort((a, b) => a.x - b.x);
  let ylo = cfg.yDomain[0], yhi = cfg.yDomain[1];
  pts.forEach(p => { if (p.y < ylo) ylo = Math.floor(p.y / 5) * 5; if (p.y > yhi) yhi = Math.ceil(p.y / 5) * 5; });
  (cfg.target || []).forEach(p => { if (p.y > yhi) yhi = Math.ceil(p.y / 5) * 5; if (p.y < ylo) ylo = Math.floor(p.y / 5) * 5; });
  const sx = t => L + (t - x0) / (x1 - x0) * (W - L - R);
  const sy = v => T + (yhi - v) / (yhi - ylo) * (H - T - B);
  const step = cfg.step || 10;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(cfg.aria) + '">';
  for (let v = Math.ceil(ylo / step) * step; v <= yhi; v += step) {
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + sy(v) + '" y2="' + sy(v) + '" stroke="var(--line)" stroke-width="1"/>';
    s += '<text x="' + (L - 8) + '" y="' + (sy(v) + 4) + '" text-anchor="end" font-size="11" font-family="var(--mono)" fill="var(--muted)">' + v + '</text>';
  }
  const m0 = new Date(cfg.xDomain[0]); m0.setDate(1);
  for (let d = new Date(m0.getFullYear(), m0.getMonth() + 1, 1); d.getTime() < x1; d.setMonth(d.getMonth() + 1)) {
    s += '<text x="' + sx(d.getTime()) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" font-family="var(--mono)" fill="var(--muted)">' + MONTHS[d.getMonth()] + ' 1</text>';
    s += '<line x1="' + sx(d.getTime()) + '" x2="' + sx(d.getTime()) + '" y1="' + (H - B) + '" y2="' + (H - B + 4) + '" stroke="var(--line-strong)"/>';
  }
  s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="var(--line-strong)" stroke-width="1"/>';
  if (cfg.stretch != null && cfg.stretch <= yhi && cfg.stretch >= ylo) {
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + sy(cfg.stretch) + '" y2="' + sy(cfg.stretch) + '" stroke="var(--line-strong)" stroke-width="1"/>';
    s += '<text x="' + (W - R) + '" y="' + (sy(cfg.stretch) - 5) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + esc(cfg.stretchLabel) + '</text>';
  }
  if (cfg.target && cfg.target.length) s += '<path d="' + cfg.target.map((p, i) => (i ? 'L' : 'M') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1)).join(' ') + '" fill="none" stroke="var(--target)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"/>';
  if (pts.length) {
    const path = pts.map((p, i) => (i ? 'L' : 'M') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1)).join(' ');
    if (pts.length > 1) s += '<path d="' + path + ' L' + sx(pts[pts.length - 1].x).toFixed(1) + ' ' + (H - B) + ' L' + sx(pts[0].x).toFixed(1) + ' ' + (H - B) + ' Z" fill="var(--series-wash)"/>';
    s += '<path d="' + path + '" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(p => { s += '<circle cx="' + sx(p.x).toFixed(1) + '" cy="' + sy(p.y).toFixed(1) + '" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/>'; });
    const last = pts[pts.length - 1], lx = sx(last.x), anchor = lx > W - R - 60 ? 'end' : 'start', dx = anchor === 'end' ? -8 : 8;
    s += '<text x="' + (lx + dx) + '" y="' + (sy(last.y) - 9) + '" text-anchor="' + anchor + '" font-size="12" font-weight="600" fill="var(--ink)" font-family="var(--mono)">' + esc(cfg.fmt(last.y)) + '</text>';
  } else {
    s += '<text x="' + (L + (W - L - R) / 2) + '" y="' + (T + (H - T - B) * 0.28) + '" text-anchor="middle" font-size="13" fill="var(--muted)">' + esc(cfg.emptyText) + '</text>';
  }
  s += '<line class="xh" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--line-strong)" stroke-width="1" style="display:none"/></svg>';
  el.innerHTML = s + '<div class="tip"></div><div class="cl"><span><i></i>' + esc(cfg.seriesLabel) + '</span>' + (cfg.target ? '<span><i class="t"></i>' + esc(cfg.targetLabel) + '</span>' : '') + (cfg.stretch != null ? '<span><i class="s"></i>' + esc(cfg.stretchLabel) + '</span>' : '') + '</div>';
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh');
  if (!pts.length) return;
  const move = ev => {
    const rect = svg.getBoundingClientRect();
    const cx = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left) / rect.width * W;
    let best = pts[0], bd = Infinity;
    pts.forEach(p => { const d = Math.abs(sx(p.x) - cx); if (d < bd) { bd = d; best = p; } });
    const px = sx(best.x), py = sy(best.y);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.style.display = '';
    tip.style.display = 'block'; tip.style.left = (px / W * rect.width) + 'px'; tip.style.top = (py / H * rect.height + 12) + 'px';
    tip.textContent = fmtShort(new Date(best.x)) + ' · ' + cfg.fmt(best.y) + (best.note ? ' · ' + best.note : '');
  };
  const leave = () => { tip.style.display = 'none'; xh.style.display = 'none'; };
  svg.addEventListener('mousemove', move); svg.addEventListener('touchstart', move, { passive: true }); svg.addEventListener('touchmove', move, { passive: true });
  svg.addEventListener('mouseleave', leave); svg.addEventListener('touchend', leave);
}

  $$('[data-rest]', root).forEach(i => i.addEventListener('change', () => { state.settings.rest[i.dataset.rest] = Math.max(15, Number(i.value) || 60); save('Saved'); }));
  $('[data-clock]', root).addEventListener('change', ev => { state.settings.clock = Math.max(30, Number(ev.target.value) || 165); save('Saved'); });
  $('[data-sound]', root).addEventListener('change', ev => { state.settings.sound = ev.target.value === '1'; save(); });
  $('[data-vib]', root).addEventListener('change', ev => { state.settings.vibrate = ev.target.value === '1'; save(); });
  $('#ics-btn').onclick = () => downloadFile('project-225.ics', buildICS(), 'text/calendar;charset=utf-8');
  $('#exp-btn').onclick = () => downloadFile('project-225-backup-' + iso(new Date()) + '.json', JSON.stringify(state, null, 2), 'application/json');
  const sb = $('#share-btn'); if (sb) sb.onclick = async () => { try { const f = new File([JSON.stringify(state, null, 2)], 'project-225-backup-' + iso(new Date()) + '.json', { type: 'application/json' }); if (navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: 'Project 225 backup' }); else toast('Sharing files not supported here — use Export'); } catch (e) { if (e && e.name !== 'AbortError') toast('Share failed — use Export'); } };
  $('#imp-file').addEventListener('change', ev => { const f = ev.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const obj = JSON.parse(rd.result); if (!obj || typeof obj !== 'object' || !('speed' in obj)) throw new Error('bad'); if (!confirm('Replace everything on this phone with the backup from ' + f.name + '?')) return; state = normalize(obj); save('Backup restored'); renderAll(); } catch (e) { toast('That file is not a Project 225 backup'); } }; rd.readAsText(f); });
  $('#reset-btn').onclick = () => { if (confirm('Erase all sessions, logs and settings on this phone? Export a backup first if you want to keep them.')) { state = freshState(); save('Erased'); renderAll(); } };
}
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type }), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  toast('Downloading ' + name);
}

/* ---------- Calendar (.ics) ---------- */
function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(line) { const enc = new TextEncoder(); const out = []; let s = line; while (enc.encode(s).length > 72) { let n = 72; while (enc.encode(s.slice(0, n)).length > 72) n--; out.push(s.slice(0, n)); s = ' ' + s.slice(n); } out.push(s); return out.join('\r\n'); }
function icsDT(d, t) { const [h, m] = t.split(':').map(Number); return iso(d).replace(/-/g, '') + 'T' + String(h).padStart(2, '0') + String(m).padStart(2, '0') + '00'; }
function buildICS() {
  const s = state.settings, L = [];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  L.push('BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Project 225//Training//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Project 225', 'X-WR-TIMEZONE:America/Chicago');
  L.push('BEGIN:VTIMEZONE', 'TZID:America/Chicago', 'BEGIN:DAYLIGHT', 'TZOFFSETFROM:-0600', 'TZOFFSETTO:-0500', 'TZNAME:CDT', 'DTSTART:19700308T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU', 'END:DAYLIGHT', 'BEGIN:STANDARD', 'TZOFFSETFROM:-0500', 'TZOFFSETTO:-0600', 'TZNAME:CST', 'DTSTART:19701101T020000', 'RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU', 'END:STANDARD', 'END:VTIMEZONE');
  const alarms = (s.alarms || [30, 15]).filter(a => a != null);
  function ev(uid, d, t, mins, summary, desc, extra) {
    const [h, m] = t.split(':').map(Number);
    const end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m + mins);
    L.push('BEGIN:VEVENT', 'UID:' + uid + '@project225', 'DTSTAMP:' + stamp, 'DTSTART;TZID=America/Chicago:' + icsDT(d, t), 'DTEND;TZID=America/Chicago:' + icsDT(end, String(end.getHours()).padStart(2, '0') + ':' + String(end.getMinutes()).padStart(2, '0')), icsFold('SUMMARY:' + icsEsc(summary)), icsFold('DESCRIPTION:' + icsEsc(desc)));
    (extra || []).forEach(x => L.push(x));
    (extra && extra.some(x => x.startsWith('RRULE')) ? [0] : alarms).forEach(a => L.push('BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc(summary)), 'TRIGGER:-PT' + a + 'M', 'END:VALARM'));
    L.push('END:VEVENT');
  }
  ev('w0-gear', new Date(2026, 8, 9), '09:00', 30, 'P225 · Order radar + overspeed trainer', 'Stack System + Stack Radar bundle, or PRGR Black + a stick set. Run the DIY overspeed protocol until it lands.');
  ev('w0-speed', new Date(2026, 8, 12), s.times.speedC, 60, 'P225 · Baseline speed test', '10 max-effort driver swings for peak club speed, then 4 × 6-ball sets for peak ball speed. Log it in the app.');
  ev('w0-strength', new Date(2026, 8, 13), '11:00', 45, 'P225 · Baseline strength tests', 'Countermovement jump, seated 10 lb med ball side throws, trap bar deadlift 3RM. Enter on Plan → Setup.');
  for (let wk = 1; wk <= PLAN.testWeek; wk++) {
    const block = blockOf(wk), ws = weekStart(wk);
    DAYS.forEach((day, i) => {
      const d = addDays(ws, i);
      (sessionsFor(wk, day, block) || []).forEach(sess => {
        if (sess.kind === 'rest') return;
        const t = sessionTime(sess); if (!t) return;
        let desc = sess.desc + (isDeload(wk) && sess.deload ? '\n\n' + sess.deload : isTaper(wk) ? '\n\nTaper week: ~40% fewer sets, same loads.' : '');
        if (sess.ex) desc += '\n\n' + sess.ex.map(r => r[0] + ' ' + r[1] + ' — ' + r[1 + (block || 1)]).join('\n');
        else if (sess.steps) desc += '\n\n' + (sess.steps[Math.max(0, block - 1)] || []).map(x => x.replace(/<[^>]+>/g, '')).join('\n');
        ev('w' + wk + '-' + day + '-' + sess.id, d, t, sessionMinutes(sess), 'P225 · ' + sess.name + (isDeload(wk) ? ' (deload)' : isTaper(wk) ? ' (taper)' : ''), desc);
      });
    });
  }
  ev('weigh', new Date(2026, 8, 9), s.times.weigh, 10, 'P225 · Weigh in', 'Morning, after the bathroom, before food. Log it on Today.', ['RRULE:FREQ=DAILY;UNTIL=20261213T235959Z']);
  ev('review', new Date(2026, 8, 13), s.times.review, 15, 'P225 · Weekly review', '7-day weight, best ball speed, sessions done. Read the review card in the app; adjust calories every second Sunday.', ['RRULE:FREQ=WEEKLY;BYDAY=SU;UNTIL=20261213T235959Z']);
  [[new Date(2026, 9, 4), 'Week 4'], [new Date(2026, 10, 1), 'Week 8'], [new Date(2026, 10, 29), 'Week 12 (taper)']].forEach(([d, w]) => ev('deload-' + iso(d), d, addMinutes(s.times.review, 15), 10, 'P225 · ' + w + ' deload starts tomorrow', 'Main lifts 3×5 at 65–70%, accessories 2 sets, overspeed 1 round, Saturday is a retest. Do not skip it.'));
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}
function addMinutes(t, n) { const [h, m] = t.split(':').map(Number); const tot = h * 60 + m + n; return String(Math.floor(tot / 60) % 24).padStart(2, '0') + ':' + String(tot % 60).padStart(2, '0'); }

/* ---------- Boot ---------- */
function renderAll() { renderCtx(); renderToday(); renderWeek(); renderLog(); renderPlan(); renderMore(); }
function showView(name) {
  $$('.nav button').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === name)));
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + name));
  try { localStorage.setItem(LS_KEY + '-tab', name); } catch (e) {}
}
$$('.nav button').forEach(t => t.addEventListener('click', () => { showView(t.dataset.view); window.scrollTo({ top: 0 }); }));
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(drawCharts, 200); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (active) requestWake(); if (timerInt) tickTimer(); if (clockInt) tickClock(); renderCtx(); } });
loadLocal();
renderAll();
try { const t = localStorage.getItem(LS_KEY + '-tab'); if (t && document.getElementById('v-' + t)) showView(t); } catch (e) {}
if (state.activeKey && findSession(state.activeKey)) openSession(state.activeKey);
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => { const nw = reg.installing; if (!nw) return; nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) $('#upd').classList.add('on'); }); });
    }).catch(e => console.warn('sw', e));
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; location.reload(); });
  });
}
$('#upd-btn').addEventListener('click', () => { navigator.serviceWorker.getRegistration().then(r => { if (r && r.waiting) r.waiting.postMessage('skipWaiting'); else location.reload(); }); });
</script>
